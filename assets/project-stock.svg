<style>
.pop{animation:pop 6s ease-in-out infinite both}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}8%,86%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
.dot{animation:dot 1.2s infinite}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s ease-out infinite both}
@keyframes grow{0%{transform:scaleX(0)}25%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.up{transform-box:fill-box;transform-origin:center bottom;animation:up 4.5s ease-out infinite both}
@keyframes up{0%{transform:scaleY(0)}30%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.scan{animation:scan 2.8s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(118px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.draw{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 5s ease-out infinite}
@keyframes draw{0%{stroke-dashoffset:300;opacity:1}55%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.fc{animation:fc 5s ease-out infinite both}
@keyframes fc{0%,50%{opacity:0}62%,88%{opacity:1}100%{opacity:0}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
