<style>
.pop{animation:pop 6s ease-in-out infinite both}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}8%,86%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
.dot{animation:dot 1.2s infinite}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s ease-out infinite both}
