.scan{animation:scan 2.8s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(118px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.draw{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 5s ease-out infinite}
@keyframes draw{0%{stroke-dashoffset:300;opacity:1}55%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.fc{animation:fc 5s ease-out infinite both}
@keyframes fc{0%,50%{opacity:0}62%,88%{opacity:1}100%{opacity:0}}
.bob{animation:bob 4s ease-in-out infinite}
