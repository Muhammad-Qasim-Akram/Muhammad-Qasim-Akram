<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".55" stop-color="#0a2a22"/><stop offset="1" stop-color="#0b6b3a"/></linearGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff41" stop-opacity=".35"/><stop offset="1" stop-color="#00ff41" stop-opacity=".03"/></linearGradient>
<clipPath id="c"><rect width="1000" height="240" rx="16"/></clipPath>
<clipPath id="t"><rect x="60" y="128" width="0" height="40"><animate attributeName="width" from="0" to="530" dur="2.4s" begin=".9s" fill="freeze"/></rect></clipPath>
</defs>
<style>
.w1{animation:slide 16s linear infinite}
.w2{animation:slide 26s linear infinite reverse}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
.name{animation:rise 1.1s ease-out both}
.tag{animation:rise 1.1s ease-out .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.glyph{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.cur{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="240" fill="url(#bg)"/>
<path class="w2" d="M0,190 Q125,150 250,190 T500,190 T750,190 T1000,190 T1250,190 T1500,190 T1750,190 T2000,190 V240 H0 Z" fill="url(#wv)" fill-opacity=".6"/>
<path class="w1" d="M0,205 Q125,165 250,205 T500,205 T750,205 T1000,205 T1250,205 T1500,205 T1750,205 T2000,205 V240 H0 Z" fill="url(#wv)"/>
<text class="glyph" style="animation-delay:0s" x="760" y="60" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="22" fill="#00ff41" fill-opacity=".28">{ }</text><text class="glyph" style="animation-delay:1.2s" x="880" y="110" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="22" fill="#00ff41" fill-opacity=".28">&lt;/&gt;</text><text class="glyph" style="animation-delay:2.1s" x="640" y="45" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="22" fill="#00ff41" fill-opacity=".28">01</text><text class="glyph" style="animation-delay:0.6s" x="930" y="40" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="22" fill="#00ff41" fill-opacity=".28">AI</text><text class="glyph" style="animation-delay:1.8s" x="820" y="170" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="22" fill="#00ff41" fill-opacity=".28">py</text>
<text class="name" x="60" y="98" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#ffffff">Muhammad Qasim Akram</text>
<g clip-path="url(#t)"><text x="60" y="155" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="25" fill="#00ff41">Full Stack Developer | AI Engineer</text></g>
<rect class="cur" x="60" y="134" width="12" height="24" fill="#00ff41"><animate attributeName="x" from="60" to="574" dur="2.4s" begin=".9s" fill="freeze"/></rect>
<text class="tag" x="60" y="196" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#9fb3c8">Django, React, Node.js, YOLOv8 and LLM apps. Building since 2023.</text>
</g>
<rect x=".5" y=".5" width="999" height="239" rx="16" fill="none" stroke="#00ff41" stroke-opacity=".35"/>
</svg>